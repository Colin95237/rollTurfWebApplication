<div class="order-form-container">
  <h2 class="form-title">Füge deine Details hinzu</h2>

  <div class="price-display">
    <p>Dein Preis beträgt: <strong>{{ orderForm.get('totalPrice')?.value }} Euro</strong></p>
  </div>

  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="order-form">
    <div class="form-group">
      <label for="name">Name</label>
      <input
        id="name"
        formControlName="name"
        [ngClass]="{ 'is-invalid': orderForm.get('name')?.invalid && orderForm.get('name')?.touched }"
        required
      >
      <div *ngIf="orderForm.get('name')?.invalid && orderForm.get('name')?.touched" class="error">
        <small *ngIf="orderForm.get('name')?.errors?.['required']">Name ist erforderlich.</small>
        <small *ngIf="orderForm.get('name')?.errors?.['pattern']">Name darf nur Groß- und Kleinbuchstaben enthalten.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="address">Adresse</label>
      <input
        id="address"
        formControlName="address"
        [ngClass]="{ 'is-invalid': orderForm.get('address')?.invalid && orderForm.get('address')?.touched }"
      >
      <div *ngIf="orderForm.get('address')?.invalid && orderForm.get('address')?.touched" class="error">
        <small>Adresse ist erforderlich.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="zipcode">Postleitzahl</label>
      <input
        id="zipcode"
        formControlName="zipcode"
        [ngClass]="{ 'is-invalid': orderForm.get('zipcode')?.invalid && orderForm.get('zipcode')?.touched }"
      >
      <div *ngIf="orderForm.get('zipcode')?.invalid && orderForm.get('zipcode')?.touched" class="error">
        <small *ngIf="orderForm.get('zipcode')?.hasError('required')">Postleitzahl ist erforderlich.</small>
        <small *ngIf="orderForm.get('zipcode')?.hasError('pattern')">Postleitzahl muss 4 oder 5 Ziffern haben.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="city">Stadt</label>
      <input
        id="city"
        formControlName="city"
        [ngClass]="{ 'is-invalid': orderForm.get('city')?.invalid && orderForm.get('city')?.touched }"
      >
      <div *ngIf="orderForm.get('city')?.invalid && orderForm.get('city')?.touched" class="error">
        <small>Stadt ist erforderlich.</small>
      </div>
    </div>

    <button type="submit" class="submit-button" [disabled]="orderForm.invalid">Zur Bestellübersicht</button>
  </form>
</div>
